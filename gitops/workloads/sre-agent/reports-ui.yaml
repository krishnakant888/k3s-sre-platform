# Web UI for the RCA reports at http://reports.localhost:8080: browse and filter reports, read one, and give feedback
# (was the diagnosis right, what fixed it). Feedback is saved next to the report on the rca-reports volume.
# No login: it is a local demo, keep it behind a trusted network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-ui
  namespace: sre-agent
  labels: {app.kubernetes.io/name: rca-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rca-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rca-ui}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          image: ghcr.io/krishnakant888/sre-agent:sha-59978ec5439f6e3827e47d3b57d0a4cfe4a8ef53
          command: [uvicorn, "agent.ui:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: REPORTS_DIR, value: /reports}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: reports, mountPath: /reports}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: reports
          persistentVolumeClaim: {claimName: rca-reports}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rca-ui
  namespace: sre-agent
  labels: {app.kubernetes.io/name: rca-ui}
spec:
  selector: {app.kubernetes.io/name: rca-ui}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rca-ui
  namespace: sre-agent
spec:
  ingressClassName: nginx
  rules:
    - host: reports.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rca-ui
                port: {name: http}
